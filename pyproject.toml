[project]
name = "spark-lakehouse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyspark==3.5.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", ".tools", ".data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

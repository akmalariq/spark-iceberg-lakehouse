name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests
        run: uv run pytest -q

  lakehouse:
    runs-on: ubuntu-latest
    services:
      minio:
        image: minio/minio:latest
        ports:
          - "9100:9100"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        options: >-
          --health-cmd "curl -f http://localhost:9100/minio/health/live || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
        command: ["server", "/data", "--address", ":9100", "--console-address", ":9101"]
      nessie:
        image: ghcr.io/projectnessie/nessie:0.108.4
        ports:
          - "19120:19120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Generate data
        run: |
          uv run python -m spark_lakehouse.generate --batch 1
          uv run python -m spark_lakehouse.generate --batch 2
      - name: Bronze
        run: |
          uv run python -m spark_lakehouse.bronze --batch 1
          uv run python -m spark_lakehouse.bronze --batch 2
      - name: Silver
        run: |
          uv run python -m spark_lakehouse.silver --init
          uv run python -m spark_lakehouse.silver
      - name: Gold
        run: uv run python -m spark_lakehouse.gold
      - name: Data quality gate
        run: |
          uv run python -m spark_lakehouse.dq \
            --spec dq/specs.json \
            --json dq/latest.json \
            --report dq/report.html
      - name: Upload DQ report
        uses: actions/upload-artifact@v4
        with:
          name: dq-report
          path: dq/report.html
          if-no-files-found: error
      - name: Verify
        run: |
          uv run python -c "
          from spark_lakehouse.config import build_spark
          spark = build_spark('ci-verify')
          n = spark.sql('SELECT count(*) AS n FROM lakehouse.gold.daily_sales').first().n
          assert n > 0, 'gold empty'
          print(f'gold daily_sales rows: {n}')
          spark.stop()
          "
